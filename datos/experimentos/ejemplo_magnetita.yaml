id: ejemplo_magnetita
nombre: 'Ejemplo: síntesis de magnetita'
reaccion: ejemplo_magnetita
descripcion: 'Ejemplo para practicar en modo simulación. Coprecipitación de magnetita:
  se dosifica la solución de hierro y el NaOH con agitación y se mide el rendimiento
  y el pH final.'
max_experimentos: 15
capacidad_vaso_ml: 100.0
supervisado: true
paciencia: 0
variables:
- nombre: vol_fe
  etiqueta: Volumen de solución de Fe
  unidad: mL
  minimo: 5.0
  maximo: 30.0
  paso: 0.5
  origen: modulo
  modulo: bomba
  accion: bombear
  parametro: volumen
- nombre: vol_naoh
  etiqueta: Volumen de NaOH
  unidad: mL
  minimo: 2.0
  maximo: 20.0
  paso: 0.1
  origen: modulo
  modulo: bureta_1
  accion: dosificar
  parametro: volumen
- nombre: velocidad
  etiqueta: Velocidad de agitación
  unidad: '%'
  minimo: 20.0
  maximo: 80.0
  paso: 1.0
  origen: modulo
  modulo: agitador
  accion: encender
  parametro: velocidad
- nombre: tiempo
  etiqueta: Tiempo de reacción
  unidad: s
  minimo: 20.0
  maximo: 120.0
  paso: 5.0
  origen: tiempo
  modulo: ''
  accion: ''
  parametro: ''
- nombre: temperatura
  etiqueta: Temperatura de la placa
  unidad: °C
  minimo: 25.0
  maximo: 60.0
  paso: 5.0
  origen: manual
  modulo: ''
  accion: ''
  parametro: ''
objetivos:
- nombre: rendimiento
  etiqueta: Rendimiento
  unidad: '%'
  direccion: maximizar
  valor: null
  tolerancia: null
  meta: 85.0
  medicion: manual
  modulo: ''
  magnitud: ''
- nombre: ph_final
  etiqueta: pH final
  unidad: ''
  direccion: alcanzar
  valor: 10.0
  tolerancia: 0.5
  meta: null
  medicion: manual
  modulo: ''
  magnitud: ''
restricciones:
- vol_fe + vol_naoh <= 45
